<style>
:root{--bg:#101510;--panel:#181f19;--panel2:#202920;--line:#303a30;--muted:#9ba79a;--text:#f2f4ea;--lime:#c8f169;--gold:#eabf62;--red:#ed7468;--blue:#85bce5;--shadow:0 12px 32px #0005}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,select{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;background:radial-gradient(ellipse at 82% 0%,#263526 0,transparent 35%),var(--bg)}.topbar{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,56px);position:sticky;top:0;background:#101510ed;backdrop-filter:blur(14px);z-index:5}.brand{display:flex;gap:12px;align-items:center}.brandmark{width:38px;height:38px;background:var(--lime);color:#182017;border-radius:12px;display:grid;place-items:center;font-size:21px;font-weight:900;transform:rotate(-4deg)}.brandtitle{font-weight:850;letter-spacing:-.04em;font-size:18px}.brandtitle span{color:var(--lime)}.season-meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);background:#ffffff08;padding:7px 10px;border-radius:99px;color:var(--text)}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding:24px clamp(16px,4vw,56px) 48px}.sidebar{display:flex;flex-direction:column;gap:7px;position:sticky;top:98px;height:max-content}.nav-label{padding:10px 12px 4px;color:#778274;font-size:10px;letter-spacing:.16em;font-weight:800;text-transform:uppercase}.nav{border:0;background:transparent;color:#aab4a8;text-align:left;padding:12px;border-radius:10px;display:flex;gap:11px;align-items:center;transition:.18s}.nav:hover,.nav.active{color:var(--text);background:#ffffff0b}.nav.active{box-shadow:inset 3px 0 var(--lime)}.navicon{width:20px;text-align:center;color:var(--lime);font-size:16px}.side-card{margin-top:22px;border:1px solid var(--line);background:linear-gradient(145deg,#222d22,#171d17);padding:16px;border-radius:14px}.side-card small{color:var(--muted)}.side-card strong{display:block;font-size:20px;margin-top:8px}.main{min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:20px}.eyebrow{color:var(--lime);font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:800}.page-head h1{font-size:clamp(27px,4vw,38px);letter-spacing:-.05em;line-height:1.05;margin:6px 0 0}.page-head p{color:var(--muted);margin:8px 0 0}.btn{border:1px solid var(--line);background:#ffffff0a;padding:10px 14px;border-radius:9px;font-weight:700;transition:.16s}.btn:hover{border-color:#718168;background:#ffffff13;transform:translateY(-1px)}.btn.primary{background:var(--lime);color:#172015;border-color:var(--lime)}.btn.primary:hover{background:#d7ff89}.btn.small{padding:7px 10px;font-size:12px}.btn.danger{color:#ffaaa0}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#1d251e,#171d18);box-shadow:var(--shadow)}.stat{padding:16px 18px}.stat label,.muted{color:var(--muted)}.stat label{font-size:12px}.stat strong{font-size:27px;display:block;margin:7px 0 2px;letter-spacing:-.04em}.stat small{font-size:12px;color:var(--muted)}.lime{color:var(--lime)!important}.gold{color:var(--gold)!important}.red{color:var(--red)!important}.main-grid{grid-template-columns:minmax(0,1.55fr) minmax(280px,.9fr)}.section{padding:19px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:10px}.section-title h2{margin:0;font-size:16px;letter-spacing:-.02em}.section-title small{color:var(--muted)}.fixture{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #ffffff0b;gap:12px}.fixture:last-child{border:0}.club{display:flex;align-items:center;gap:10px}.crest{width:35px;height:35px;border-radius:10px;background:#293628;display:grid;place-items:center;color:var(--lime);font-weight:900;font-size:12px}.opponent{font-weight:700}.fixture small{color:var(--muted)}.kick{color:var(--lime);font-weight:800;font-variant-numeric:tabular-nums}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-transform:uppercase;letter-spacing:.1em;color:#899588;text-align:left;font-size:10px;font-weight:800;padding:8px 8px}.table td{padding:10px 8px;border-top:1px solid #ffffff0b}.table td:not(:first-child),.table th:not(:first-child){text-align:center}.table tr.mine{background:#c8f16912;color:var(--lime);font-weight:800}.rank{color:#829080;width:24px}.target{border-left:3px solid var(--lime);padding:3px 0 3px 13px}.target strong{display:block;margin-bottom:4px}.progress{height:6px;background:#303a30;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{height:100%;display:block;background:var(--lime);border-radius:99px}.feed-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff0b}.feed-item:last-child{border:0}.feed-icon{width:34px;height:34px;border-radius:50%;background:#293628;display:grid;place-items:center;flex:none}.feed-item p{margin:0}.feed-item small{color:var(--muted);display:block;margin-top:5px}.actions{display:flex;gap:9px;flex-wrap:wrap}.wide{width:100%}.select{background:#212a21;border:1px solid var(--line);padding:9px 11px;color:var(--text);border-radius:8px}.empty{padding:36px 20px;text-align:center;color:var(--muted)}.hidden{display:none!important}.status{border:1px solid #ffffff12;background:#ffffff08;padding:4px 8px;border-radius:99px;font-size:11px;color:var(--muted);white-space:nowrap}.tag{color:var(--lime);background:#c8f16913;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800}.player-row{display:grid;grid-template-columns:1.3fr .6fr .45fr .45fr .6fr auto;align-items:center;gap:8px;padding:11px 8px;border-bottom:1px solid #ffffff0b}.player-row.head{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.player-name{font-weight:700}.player-meta{font-size:11px;color:var(--muted)}.modal-back{position:fixed;inset:0;background:#000a;z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);background:#1b231c;border:1px solid #3b473b;border-radius:17px;padding:24px;box-shadow:0 20px 70px #0009}.modal h2{margin:0 0 8px;letter-spacing:-.04em}.modal p{color:var(--muted)}.toast{position:fixed;bottom:20px;right:20px;background:#d7ff89;color:#172015;padding:12px 18px;border-radius:10px;font-weight:800;z-index:20;box-shadow:var(--shadow);animation:pop .2s ease}@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}.choice{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:12px;background:#ffffff05;margin-top:10px}.choice:hover{border-color:#7e9866}.choice h3{margin:0 0 4px;font-size:16px}.choice p{margin:0;font-size:12px}.choice-details{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}.choice-details b{color:var(--text)}.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hero{padding:25px;background:linear-gradient(110deg,#202a20dd,#1a211bdd),radial-gradient(circle at 85%,#435439,transparent 40%);border:1px solid var(--line);border-radius:16px;margin-bottom:18px}.hero-line{display:flex;justify-content:space-between;align-items:center;gap:20px}.hero h2{font-size:27px;letter-spacing:-.04em;margin:4px 0}.hero p{margin:0;color:var(--muted)}.hero-badge{font-size:42px;width:65px;height:65px;border-radius:18px;background:#c8f1691c;display:grid;place-items:center;color:var(--lime)}.match-event{padding:9px 12px;border-left:2px solid #52614f;margin:6px 0;color:#d9ded5}.match-event.goal{border-color:var(--lime)}.scoreboard{display:flex;justify-content:center;align-items:center;gap:25px;padding:25px;text-align:center}.scoreboard strong{font-size:40px;letter-spacing:-.05em}.scoreboard .team{min-width:100px;font-weight:800}.pitch{background:linear-gradient(90deg,#263a29,#2d432f);border:1px solid #445b43;border-radius:14px;padding:15px;display:grid;gap:10px}.pitch-line{display:flex;justify-content:space-around;gap:8px}.shirt{background:#c8f169;color:#142113;border-radius:8px;padding:8px 7px;text-align:center;font-size:10px;min-width:58px;font-weight:800}.shirt small{display:block;font-weight:500;opacity:.75}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow:auto}.tab{background:none;border:0;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{color:var(--lime);border-color:var(--lime)}.notice{padding:12px;border:1px solid #eabf6233;background:#eabf620d;border-radius:10px;color:#e7d8b7;font-size:13px}.bottom-nav{display:none}
</style>

<body><div id="app" class="app"></div><div id="modal-root"></div>
<script>
'use strict';
const SAVE_KEY='rtgm-save-v1';
const clubs=[
 {name:'Aurora di Borgo',city:'Bergamo',league:'Serie C · Girone A',level:58,budget:500,target:'Lottare per i playoff',goal:'playoffs',prestige:18,color:'#c8f169',style:'Organizzazione e ripartenze'},
 {name:'Portside Athletic',city:'Merseyport',league:'League Two',level:56,budget:500,target:'Salvezza tranquilla',goal:'safe',prestige:16,color:'#79b9e8',style:'Pressing intenso'},
 {name:'Eisenstadt 04',city:'Eisenstadt',league:'3. Liga',level:57,budget:500,target:'Metà classifica',goal:'mid',prestige:17,color:'#ed7468',style:'Possesso verticale'},
 {name:'Sporting Valleverde',city:'Valleverde',league:'Serie C · Girone B',level:60,budget:500,target:'Qualificazione playoff',goal:'playoffs',prestige:20,color:'#eabf62',style:'Calcio propositivo'},
 {name:'Nordhafen FC',city:'Nordhafen',league:'Regionalliga Nord',level:54,budget:500,target:'Evitare la retrocessione',goal:'safe',prestige:14,color:'#c58fea',style:'Blocco compatto'}
];
const firstNames=['Luca','Marco','Nicolò','Tommaso','Davide','Edoardo','Samuele','Andrea','Matteo','Alessio','Pietro','Gabriele','Riccardo','Filippo','Leonardo','Michele','Diego','Jacopo','Elia','Fabio','Dario','Sandro','Milan','Jonas','Hugo','Noah','Emil','Rafael','Tiago','Marek'];
const lastNames=['Riva','Conti','Gallo','Moretti','Greco','Marini','Costa','Bianchi','Ferri','Serra','Romano','Villa','Lombardi','Marchetti','Ricci','Fontana','De Luca','Benedetti','Kovac','Weber','Silva','Muller','Rossi','Bauer','Neri','Fischer'];
const roles=['POR','DC','DC','TD','TS','MED','MED','CC','CC','AD','AS','ATT','ATT'];
const positions={POR:'Portiere',DC:'Difensore centrale',TD:'Terzino destro',TS:'Terzino sinistro',MED:'Mediano',CC:'Centrocampista',AD:'Ala destra',AS:'Ala sinistra',ATT:'Attaccante'};
const formations={'4-4-2':{POR:1,DC:2,TD:1,TS:1,MED:1,CC:1,AD:1,AS:1,ATT:2},'4-3-3':{POR:1,DC:2,TD:1,TS:1,MED:1,CC:1,AD:1,AS:1,ATT:2},'3-5-2':{POR:1,DC:3,TD:0,TS:0,MED:1,CC:3,AD:0,AS:0,ATT:2},'4-2-3-1':{POR:1,DC:2,TD:1,TS:1,MED:2,CC:1,AD:1,AS:1,ATT:1}};
let state=load();let view='home';let toastTimer;
function load(){try{return JSON.parse(localStorage.getItem(SAVE_KEY))}catch{return null}}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function makePlayer(i,level=57,age=null){const pos=roles[i%roles.length];const overall=Math.max(42,Math.min(83,Math.round(level+(Math.random()*12-6))));return{id:'p'+Math.random().toString(36).slice(2,9),name:`${firstNames[Math.floor(Math.random()*firstNames.length)]} ${lastNames[Math.floor(Math.random()*lastNames.length)]}`,pos,overall,age:age||18+Math.floor(Math.random()*15),value:Math.max(20,Math.round((overall-40)*2.1)),stamina:85+Math.floor(Math.random()*16),injury:0,bans:0,yellow:0,goals:0,assists:0,starter:false}}
function initGame(index){const c=clubs[index];const squad=Array.from({length:22},(_,i)=>makePlayer(i,c.level));const opponents=Array.from({length:19},(_,i)=>({name:['Città di Lario','Union Bellavista','Real Pietracava','Atletico Riva','FC Monteluce','San Rocco 1912','Dynamo Est','Olmo Calcio','Verona Nuova','Marina United','Borgo Nuovo','Stella Rossa FC','AC Rivaforte','Val d’Oro','Grifoni Calcio','Pro Fontana','Lions Athletic','Fiume Sport','Montechiaro'][i],level:c.level-5+Math.floor(Math.random()*11),pts:0,w:0,d:0,l:0,gf:0,ga:0}));const all=[{name:c.name,level:c.level,pts:0,w:0,d:0,l:0,gf:0,ga:0},...opponents];state={club:index,clubName:c.name,league:c.league,level:c.level,budget:500,season:1,week:0,day:'Lun 04 Ago',rep:10,prestige:c.prestige,trophies:0,goal:c.goal,target:c.target,formation:'4-4-2',tactic:'Equilibrato',squad,table:all,fixtures:[],cupRound:0,cupName:'Coppa nazionale',news:[],history:[],career:'Allenatore emergente',contract:1,match:null,transfers:[],pendingCareer:null,gameStarted:true};setLineup();makeFixtures();addNews(`È ufficiale: ${c.name} affida la panchina a un nuovo allenatore.`, '📣');save();view='home';render()}
function setLineup(){const f=formations[state.formation]||formations['4-4-2'];state.squad.forEach(p=>p.starter=false);let used=new Set;for(const pos of Object.keys(f)){let need=f[pos];state.squad.filter(p=>p.pos===pos&&!p.injury&&!p.bans).sort((a,b)=>b.overall-a.overall).slice(0,need).forEach(p=>{p.starter=true;used.add(p.id)})}const missing=11-[...used].length;state.squad.filter(p=>!used.has(p.id)&&!p.injury&&!p.bans).sort((a,b)=>b.overall-a.overall).slice(0,Math.max(0,missing)).forEach(p=>p.starter=true)}
function newLeagueTable(name,level){const names=['Città di Lario','Union Bellavista','Real Pietracava','Atletico Riva','FC Monteluce','San Rocco 1912','Dynamo Est','Olmo Calcio','Verona Nuova','Marina United','Borgo Nuovo','Stella Rossa FC','AC Rivaforte','Val d’Oro','Grifoni Calcio','Pro Fontana','Lions Athletic','Fiume Sport','Montechiaro','Aurora Marina','Virtus delle Valli'];return [{name,level,pts:0,w:0,d:0,l:0,gf:0,ga:0},...names.filter(n=>n!==name).slice(0,19).map(n=>({name:n,level:level-5+Math.floor(Math.random()*11),pts:0,w:0,d:0,l:0,gf:0,ga:0}))]}function makeFixtures(){const teams=state.table.map(t=>t.name);let n=teams.length,arr=[];for(let r=0;r<n-1;r++){let games=[];for(let i=0;i<n/2;i++){let a=teams[i],b=teams[n-1-i];if((r+i)%2)[a,b]=[b,a];games.push({home:a,away:b,played:false,score:null});}arr.push(games);teams.splice(1,0,teams.pop())}state.fixtures=[...arr,...arr.map(day=>day.map(g=>({home:g.away,away:g.home,played:false,score:null})))];state.week=0}
function sortedTable(){return [...state.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function myTable(){return sortedTable().findIndex(t=>t.name===state.clubName)+1}
function nextFixture(){return state.fixtures[state.week]?.find(g=>g.home===state.clubName||g.away===state.clubName)}
function opponentOf(g){return g?.home===state.clubName?g.away:g?.home}
function addNews(text,icon='⚽',kind='news'){state.news.unshift({text,icon,kind,day:state.day});state.news=state.news.slice(0,35)}
function say(text){clearTimeout(toastTimer);let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=text;toastTimer=setTimeout(()=>el.remove(),2800)}
function money(n){return `${Math.floor(n)} cr`}
function roundDay(){return Math.max(1,state.week+1)}
function objectiveStatus(){const rank=myTable();if(state.goal==='safe')return rank<=15?'In linea con le attese':'Zona rischio';if(state.goal==='mid')return rank<=12?'In linea con le attese':'Sotto le attese';return rank<=8?'Obiettivo alla portata':'Inseguimento playoff'}
function header(){return `<header class="topbar"><div class="brand"><div class="brandmark">R</div><div class="brandtitle">ROAD TO <span>GLORY</span> <small style="font-weight:500;color:#9ba79a">MANAGER</small></div></div><div class="season-meta"><span>${state?.clubName||'Carriera'}</span><span class="pill">${state?`Stagione ${state.season} · ${state.league}`:'Nuova carriera'}</span></div></header>`}
function nav(){const items=[['home','⌂','Panoramica'],['squad','♙','Rosa & tattica'],['market','↗','Calciomercato'],['world','◉','Mondo Calcio'],['career','♜','Carriera']];return `<aside class="sidebar"><div class="nav-label">Clubhouse</div>${items.map(([id,ico,label])=>`<button class="nav ${view===id?'active':''}" onclick="go('${id}')"><span class="navicon">${ico}</span>${label}</button>`).join('')}<div class="side-card"><small>OBIETTIVO DIRIGENZA</small><strong style="font-size:16px">${state?.target||'Scegli una squadra'}</strong><div class="progress"><i style="width:${state?Math.min(100,Math.max(12,myTable()<=8?76:36)):0}%"></i></div><small style="display:block;margin-top:8px">${state?objectiveStatus():'La tua scalata inizia qui'}</small></div><div class="nav-label" style="margin-top:8px">La tua carriera</div><div style="padding:8px 12px;color:#aab4a8;font-size:13px">🏆 ${state?.trophies||0} trofei &nbsp;·&nbsp; ⭐ ${state?.rep||0} reputazione</div><button class="nav" onclick="resetGame()"><span class="navicon">↻</span>Nuova carriera</button></aside>`}
function layout(content){return `${header()}<div class="layout">${nav()}<main class="main">${content}</main></div>`}
function heading(eyebrow,title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`}
function render(){const root=document.getElementById('app');if(!state?.gameStarted){root.innerHTML=header()+intro();return}let content=view==='home'?home():view==='squad'?squadPage():view==='market'?marketPage():view==='world'?worldPage():careerPage();root.innerHTML=layout(content);if(state.match){if(state.match.mode==='detailed')renderMatchLive();else if(state.match.mode==='normal')renderMatchNormal()}}
function intro(){return `<main style="max-width:1080px;margin:0 auto;padding:44px 20px 60px"><div class="eyebrow">La tua panchina ti aspetta</div><h1 style="font-size:clamp(36px,6vw,64px);letter-spacing:-.06em;line-height:1.02;max-width:700px;margin:12px 0">Dal fango dei campi di provincia <span class="lime">alla gloria.</span></h1><p style="color:var(--muted);font-size:17px;max-width:670px;line-height:1.65">Costruisci una carriera, conquista trofei e scrivi la tua storia. Ogni scelta è tua: il tempo avanza solo quando lo decidi tu.</p><div class="section-title" style="margin:34px 0 14px"><h2>Scegli il tuo primo incarico</h2><small>5 club · Stagione 1</small></div><div class="team-grid">${clubs.map((c,i)=>`<article class="card choice"><div><div class="eyebrow">${c.league} · ${c.city}</div><h3>${c.name}</h3><p>${c.style}</p><div class="choice-details"><span>Rosa <b>${c.level}</b></span><span>Budget <b>500 cr</b></span><span>Prestigio <b>${c.prestige}</b></span></div><div style="margin-top:9px"><span class="tag">Obiettivo: ${c.target}</span></div></div><button class="btn primary" onclick="initGame(${i})">Scegli club ↗</button></article>`).join('')}</div><p style="color:#778274;font-size:12px;margin-top:18px">Club e atleti sono fittizi, creati per il gioco. Partite e mercato sono simulati.</p></main>`}
function home(){const rank=myTable(),next=nextFixture(),opp=opponentOf(next);const standings=sortedTable();const matchBtn=state.week<state.fixtures.length?`<button class="btn primary" onclick="openMatchSetup()">Vai alla partita&nbsp; ↗</button>`:`<button class="btn primary" onclick="endSeason()">Concludi stagione ↗</button>`;return `${heading('Stagione '+state.season,'Benvenuto, Mister.',`${state.day} · ${state.league}`,matchBtn)}<div class="grid stats"><div class="card stat"><label>Posizione in campionato</label><strong>${rank}<span style="font-size:14px;color:var(--muted)"> / ${state.table.length}</span></strong><small>${rank<=3?'Zona promozione':rank>state.table.length-4?'Zona retrocessione':'Classifica generale'}</small></div><div class="card stat"><label>Prossimo avversario</label><strong style="font-size:19px;margin-top:10px">${opp?esc(opp):'Fine stagione'}</strong><small>${next?`Giornata ${state.week+1} · ${next.home===state.clubName?'In casa':'In trasferta'}`:'Pronto per la nuova stagione'}</small></div><div class="card stat"><label>Crediti disponibili</label><strong class="lime">${money(state.budget)}</strong><small>Mercato estivo/invernale</small></div><div class="card stat"><label>Obiettivo dirigenza</label><strong style="font-size:18px;margin-top:10px">${esc(state.target)}</strong><small class="${objectiveStatus().includes('Sotto')||objectiveStatus().includes('rischio')?'red':'lime'}">${objectiveStatus()}</small></div></div><div class="grid main-grid"><section class="card section"><div class="section-title"><h2>Classifica</h2><small>${state.league}</small></div><table class="table"><thead><tr><th>#</th><th style="text-align:left">Club</th><th>PG</th><th>DR</th><th>PT</th></tr></thead><tbody>${standings.slice(0,5).map((t,i)=>tableRow(t,i)).join('')}${rank>5&&rank<=state.table.length-3?`<tr class="mine"><td>…</td><td style="text-align:left">${esc(state.clubName)}</td><td>${state.week}</td><td>${myRow().gf-myRow().ga}</td><td>${myRow().pts}</td></tr>`:''}${standings.slice(-3).map((t,i)=>tableRow(t,standings.length-3+i)).join('')}</tbody></table><div class="actions" style="margin-top:14px"><button class="btn small" onclick="go('squad')">Gestisci la rosa</button><button class="btn small" onclick="go('world')">Apri Mondo Calcio</button><button class="btn small" onclick="openMatchSetup('cup')">Coppa nazionale</button></div></section><div class="grid" style="align-content:start"><section class="card section"><div class="section-title"><h2>Voce dalla clubhouse</h2><span class="tag">LIVE</span></div><div class="target"><strong>${esc(state.target)}</strong><span class="muted">La dirigenza valuta il tuo lavoro: <b class="${objectiveStatus().includes('Sotto')?'red':'lime'}">${objectiveStatus()}</b></span><div class="progress"><i style="width:${rank<=8?78:35}%"></i></div></div><div style="margin-top:16px" class="fixture"><div class="club"><div class="crest">${state.clubName.slice(0,2).toUpperCase()}</div><div><div class="opponent">${esc(state.clubName)}</div><small>Rosa · ${state.squad.length} giocatori</small></div></div><strong class="kick">${avgLevel()} OVR</strong></div><div class="fixture"><div class="club"><div class="crest">🏆</div><div><div class="opponent">Palmarès</div><small>Trofei in carriera</small></div></div><strong class="kick">${state.trophies}</strong></div></section><section class="card section"><div class="section-title"><h2>Ultime dal mondo</h2><button class="btn small" onclick="go('world')">Tutte →</button></div>${state.news.slice(0,2).map(feedItem).join('')||'<p class="muted">Le notizie arriveranno presto.</p>'}</section></div></div>`}
function myRow(){return state.table.find(t=>t.name===state.clubName)}function tableRow(t,i){return `<tr class="${t.name===state.clubName?'mine':''}"><td class="rank">${i+1}</td><td style="text-align:left">${esc(t.name)}</td><td>${t.w+t.d+t.l}</td><td>${t.gf-t.ga>0?'+':''}${t.gf-t.ga}</td><td><b>${t.pts}</b></td></tr>`}function avgLevel(){return Math.round(state.squad.filter(p=>p.starter).reduce((a,p)=>a+p.overall,0)/Math.max(1,state.squad.filter(p=>p.starter).length))}function feedItem(n){return `<div class="feed-item"><div class="feed-icon">${n.icon}</div><div><p>${esc(n.text)}</p><small>${n.day||state.day} · ${n.kind==='social'?'Social':n.kind==='market'?'Mercato':'Mondo Calcio'}</small></div></div>`}
function go(id){view=id;render()}
function squadPage(){const starters=state.squad.filter(p=>p.starter).sort((a,b)=>roles.indexOf(a.pos)-roles.indexOf(b.pos));const reserves=state.squad.filter(p=>!p.starter).sort((a,b)=>roles.indexOf(a.pos)-roles.indexOf(b.pos));return `${heading('La tua squadra','Rosa & tattica','Disponibilità, forma e scelte di formazione. Modifiche sempre possibili.') }<div class="grid main-grid"><section class="card section"><div class="section-title"><h2>Impostazioni tattiche</h2><span class="tag">${avgLevel()} OVR titolari</span></div><div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:17px"><label class="muted">Modulo<br><select class="select" onchange="setFormation(this.value)">${Object.keys(formations).map(x=>`<option ${state.formation===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="muted">Stile di gioco<br><select class="select" onchange="state.tactic=this.value;save();say('Atteggiamento aggiornato')">${['Equilibrato','Pressing alto','Contropiede','Possesso palla','Difesa bassa','Tutto per tutto'].map(x=>`<option ${state.tactic===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="pitch">${['ATT','AD','AS','CC','MED','DC','TD','TS','POR'].map(pos=>{const players=starters.filter(p=>p.pos===pos);return players.length?`<div class="pitch-line">${players.map(p=>`<div class="shirt">${p.name.split(' ')[1]}<small>${p.pos} · ${p.overall}</small></div>`).join('')}</div>`:''}).join('')}</div><div class="section-title" style="margin-top:22px"><h2>Titolari · ${starters.length}/11</h2><small>La selezione automatica schiera i più forti</small></div>${playerList(starters)}<div class="section-title" style="margin-top:22px"><h2>Panchina & riserve</h2><small>${reserves.length} giocatori</small></div>${playerList(reserves)}</section><section class="grid" style="align-content:start"><div class="card section"><div class="section-title"><h2>Disponibilità</h2></div><div class="fixture"><span>Infortunati</span><b class="${state.squad.some(p=>p.injury)?'red':'lime'}">${state.squad.filter(p=>p.injury).length}</b></div><div class="fixture"><span>Squalificati</span><b class="${state.squad.some(p=>p.bans)?'red':'lime'}">${state.squad.filter(p=>p.bans).length}</b></div><div class="fixture"><span>Forma media</span><b>${Math.round(state.squad.reduce((a,p)=>a+p.stamina,0)/state.squad.length)}%</b></div><button class="btn wide" style="margin-top:12px" onclick="autoLineup()">↻ Miglior formazione</button></div><div class="card section"><div class="section-title"><h2>Regole squadra</h2></div><p class="muted" style="font-size:13px">La stanchezza diminuisce dopo ogni gara. Infortuni e squalifiche si risolvono con il passare delle giornate. Puoi cambiare assetto prima e durante ogni partita.</p></div></section></div>`}
function playerList(players){return `<div class="player-row head"><span>Giocatore</span><span>Ruolo</span><span>OVR</span><span>Età</span><span>Forma</span><span>Stato</span></div>${players.map(p=>`<div class="player-row"><div><div class="player-name">${esc(p.name)}</div><div class="player-meta">Valore ${money(p.value)} · ${p.goals} gol</div></div><span>${p.pos}</span><b>${p.overall}</b><span>${p.age}</span><span style="color:${p.stamina<45?'var(--red)':'var(--lime)'}">${p.stamina}%</span><span>${p.injury?`<span class="status red">Infortunato ${p.injury}g</span>`:p.bans?`<span class="status red">Squalifica ${p.bans}g</span>`:`<button class="btn small" onclick="toggleStarter('${p.id}')">${p.starter?'Titolare':'Schiera'}</button>`}</span></div>`).join('')}`}
function setFormation(v){state.formation=v;setLineup();save();render()}function autoLineup(){setLineup();save();render();say('Miglior formazione schierata')}function toggleStarter(id){let p=state.squad.find(x=>x.id===id);if(!p||p.injury||p.bans)return;p.starter=!p.starter;if(state.squad.filter(x=>x.starter).length>11){p.starter=false;say('Massimo 11 titolari');return}save();render()}
function marketPage(){const offers=state.squad.filter(p=>!p.starter&&p.overall>55);return `${heading('Area tecnica','Calciomercato','Acquista, cedi e rinnova la rosa.',`<span class="tag">${money(state.budget)} disponibili</span>`)}<div class="grid main-grid"><section class="card section"><div class="section-title"><h2>Mercato attivo</h2><span class="status">${state.week<4?'Finestra estiva':state.week>=17&&state.week<=24?'Finestra invernale':'Scouting continuo'}</span></div><div class="notice">Ogni sessione assegna <b>500 crediti</b> di budget alla tua squadra. Le cessioni aumentano i fondi; ingaggi e trasferimenti sono inclusi nel prezzo.</div><div class="tabs" style="margin-top:18px"><button class="tab active" id="tab-buy" onclick="showMarketTab('buy')">Obiettivi scouting</button><button class="tab" id="tab-sell" onclick="showMarketTab('sell')">Lista cessioni</button></div><div id="market-content">${marketBuy()}</div></section><section class="card section"><div class="section-title"><h2>Movimenti nel mondo</h2><span class="tag">LIVE</span></div>${state.transfers.slice(0,6).map(t=>`<div class="fixture"><div><div class="opponent">${esc(t.player)}</div><small>${esc(t.from)} → ${esc(t.to)}</small></div><b class="kick">${money(t.fee)}</b></div>`).join('')||'<p class="muted">I rumors di mercato compariranno qui.</p>'}<button class="btn wide" style="margin-top:14px" onclick="worldTransfer()">Simula notizie di mercato</button></section></div>`}
function marketBuy(){const list=makeMarket();return `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${list.map(p=>`<article class="card" style="padding:14px;background:#ffffff04"><div class="eyebrow">${p.pos} · ${p.age} anni · OVR ${p.overall}</div><h3 style="font-size:15px;margin:6px 0">${esc(p.name)}</h3><div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">${money(p.value)}</span><button class="btn small primary" onclick="buyPlayer('${p.id}')">Acquista</button></div></article>`).join('')}</div><p class="muted" style="font-size:12px;margin-top:12px">Profili di fascia bassa: 20–80 crediti. I top player costano migliaia di crediti.</p>`}
function makeMarket(){if(!state.marketPool){state.marketPool=Array.from({length:8},(_,i)=>makePlayer(i,49+Math.floor(Math.random()*17),19+Math.floor(Math.random()*12)));state.marketPool.push(makePlayer(9,86,26));}return state.marketPool}
function marketSell(){return `<div class="player-row head"><span>Giocatore</span><span>Ruolo</span><span>OVR</span><span>Età</span><span>Prezzo</span><span></span></div>${state.squad.filter(p=>!p.starter).map(p=>`<div class="player-row"><b>${esc(p.name)}</b><span>${p.pos}</span><b>${p.overall}</b><span>${p.age}</span><span>${money(p.value)}</span><button class="btn small danger" onclick="sellPlayer('${p.id}')">Cedi</button></div>`).join('')}`}
function showMarketTab(tab){document.getElementById('tab-buy')?.classList.toggle('active',tab==='buy');document.getElementById('tab-sell')?.classList.toggle('active',tab==='sell');document.getElementById('market-content').innerHTML=tab==='buy'?marketBuy():marketSell()}
function buyPlayer(id){let p=makeMarket().find(p=>p.id===id);if(!p)return;if(state.budget<p.value){say('Budget insufficiente');return}if(state.squad.length>=30){say('Rosa al completo (max 30)');return}state.budget-=p.value;state.squad.push({...p,stamina:100});state.marketPool=state.marketPool.filter(x=>x.id!==id);save();render();say(`${p.name} è un nuovo giocatore!`)}
function sellPlayer(id){const p=state.squad.find(p=>p.id===id);if(!p)return;state.squad=state.squad.filter(x=>x.id!==id);state.budget+=p.value;save();render();say(`Cessione completata: +${money(p.value)}`)}
function worldTransfer(){const names=['Real Madrigal','North London City','Bayernheim','Paris Royale','Milano Rossonera','Barcellona del Mar'];const a=names[Math.floor(Math.random()*names.length)],b=names.filter(x=>x!==a)[Math.floor(Math.random()*5)],p=makePlayer(10,78+Math.floor(Math.random()*9),22+Math.floor(Math.random()*9));const fee=1800+Math.floor(Math.random()*6000);state.transfers.unshift({player:p.name,from:a,to:b,fee});addNews(`${b} mette a segno il colpo ${p.name}: affare da ${fee.toLocaleString('it-IT')} crediti.`, '💸','market');save();render();say('Ultima notizia di mercato aggiornata')}
function worldPage(){return `${heading('Social & notizie','Mondo Calcio','Il feed del pallone: campo, mercato e voci di spogliatoio.',`<button class="btn" onclick="generateWorldNews()">↻ Aggiorna feed</button>`)}<div class="grid main-grid"><section class="card section"><div class="section-title"><h2>Il feed</h2><span class="status">${state.day} · aggiornato</span></div>${state.news.length?state.news.map(feedItem).join(''):'<div class="empty">Nessuna notizia al momento. Il mondo del calcio si sta svegliando…</div>'}</section><section class="grid" style="align-content:start"><div class="card section"><div class="section-title"><h2>La tua eco social</h2><span class="tag">@RTGM</span></div>${socialPosts().map(n=>`<div class="feed-item"><div class="feed-icon">${n.icon}</div><div><p><b>${n.user}</b> <span class="muted">${n.handle}</span></p><p style="margin-top:5px">${n.text}</p><small>♡ ${n.likes} · ${n.time}</small></div></div>`).join('')}</div><div class="card section"><div class="section-title"><h2>Premi stagionali</h2><span class="status">Stagione ${state.season}</span></div><div class="fixture"><div><b>Pallone d’Oro</b><small style="display:block">${state.week>30?'Assegnazione a fine stagione':'In palio a giugno'}</small></div><span>🏅</span></div><div class="fixture"><div><b>Miglior giovane</b><small style="display:block">Talent scout al lavoro</small></div><span>🌟</span></div><div class="fixture"><div><b>Allenatore dell’anno</b><small style="display:block">${state.rep>=40?'Sei tra i candidati':'La reputazione cresce'}</small></div><span>🧠</span></div></div></section></div>`}
function socialPosts(){let user=state.clubName.split(' ')[0];return[{icon:'💚',user:'Curva '+user,handle:'@ultras_'+user.toLowerCase(),text:myTable()<=8?'Mister ha dato un’identità alla squadra. Avanti così!':'Serve una scossa, questa classifica non ci rappresenta.',likes:320+state.week*7,time:'12 min'},{icon:'🎙️',user:'Mister avversario',handle:'@coach_voice',text:`Contro ${state.clubName} ci aspetta una partita vera. Hanno qualità e fame.`,likes:87,time:'1 h'},{icon:'👀',user:'Spogliatoio anonimo',handle:'@insidefootball',text:'Si dice che il gruppo sia compatto e pronto a seguire il nuovo progetto.',likes:156,time:'3 h'}]}
function generateWorldNews(){const headlines=['Clamoroso in coppa: la favorita saluta ai quarti dopo una rimonta incredibile.','La capolista cade in trasferta: campionato riaperto a sorpresa!','Voci di mercato: un giovane talento è seguito da mezza Europa.','Serata europea da ricordare: tripletta e record per il bomber della stagione.','Un derby acceso finisce in parità: tifosi divisi sui social.'];addNews(headlines[Math.floor(Math.random()*headlines.length)],['🌍','⚡','🗞️','🏆'][Math.floor(Math.random()*4)]);save();render();say('Feed aggiornato')}
function careerPage(){const offers=careerOffers();return `${heading('Il tuo percorso','Carriera','Costruisci la reputazione e guida il club verso nuovi traguardi.',state.pendingCareer?'<button class="btn primary" onclick="showCareerDecision()">Riprendi scelta di fine stagione</button>':'')}<div class="grid stats"><div class="card stat"><label>Reputazione</label><strong class="lime">${state.rep}<span style="font-size:14px;color:var(--muted)"> / 100</span></strong><small>${state.rep<25?'Promessa emergente':state.rep<55?'Tecnico affermato':'Nome di prestigio'}</small></div><div class="card stat"><label>Trofei conquistati</label><strong>${state.trophies}</strong><small>${state.history.length} stagioni completate</small></div><div class="card stat"><label>Club attuale</label><strong style="font-size:19px">${esc(state.clubName)}</strong><small>${state.league}</small></div><div class="card stat"><label>Contratto</label><strong style="font-size:20px">${state.contract} stagione/i</strong><small>Revisione a fine campionato</small></div></div><div class="grid main-grid"><section class="card section"><div class="section-title"><h2>Offerte disponibili</h2><span class="status">${state.rep<20?'Reputazione in crescita':'Mercato allenatori'}</span></div>${offers.length?offers.map((o,i)=>`<div class="choice"><div><div class="eyebrow">${o.league} · prestigio ${o.prestige}</div><h3>${o.name}</h3><p>${o.target} · Rosa ${o.level} OVR</p></div><button class="btn ${i===0?'primary':''}" onclick="acceptOffer(${i})">Accetta</button></div>`).join(''):'<div class="empty">Nessuna offerta al momento. I risultati convincenti apriranno nuove porte.</div>'}<p class="muted" style="font-size:12px;margin-top:12px">Le offerte più prestigiose si sbloccano con reputazione e trofei. A fine stagione puoi rinnovare o cambiare panchina.</p></section><section class="card section"><div class="section-title"><h2>Il tuo palmarès</h2></div><div style="font-size:48px;text-align:center;padding:20px">🏆</div><div style="text-align:center"><b style="font-size:24px">${state.trophies}</b><p class="muted">trofei in carriera</p></div><div class="section-title"><h2>Stagioni</h2></div>${state.history.slice(-5).reverse().map(x=>`<div class="fixture"><span>Stagione ${x.season} · ${esc(x.club)}</span><b class="${x.result==='success'?'lime':'muted'}">${x.rank}° posto ${x.trophy?'· 🏆':''}</b></div>`).join('')||'<p class="muted">La tua storia comincia oggi.</p>'}</section></div>`}
function careerOffers(){let options=[{name:'FC Monteluce',city:'Monteluce',league:'Serie B',level:66,prestige:36,target:'Lottare per la promozione',goal:'promotion'},{name:'Eastborough Rovers',city:'Eastborough',league:'League One',level:68,prestige:40,target:'Metà classifica',goal:'mid'},{name:'SC Rheinstadt',city:'Rheinstadt',league:'2. Bundesliga',level:70,prestige:45,target:'Salvezza',goal:'safe'},{name:'Città di Lario',city:'Lario',league:'Serie B',level:73,prestige:52,target:'Playoff promozione',goal:'playoffs'}];return options.filter(o=>state.rep>=o.prestige-20&&state.rep+state.trophies*8>=o.prestige-12).slice(0,3)}
function acceptOffer(i){const o=state.pendingCareer?(state.pendingCareer.offers||[])[i]:careerOffers()[i];if(!o)return;let old=state.clubName;state.pendingCareer=null;state.clubName=o.name;state.league=o.league;state.level=o.level;state.budget=500;state.target=o.target;state.goal=o.goal;state.prestige=o.prestige;state.contract=2;state.table=newLeagueTable(o.name,o.level);state.cupRound=0;state.squad=Array.from({length:22},(_,j)=>makePlayer(j,o.level));setLineup();makeFixtures();addNews(`Nuova avventura: ${state.clubName} presenta il suo nuovo allenatore, in arrivo da ${old}.`,'🖊️');state.week=0;state.day='Lun 04 Ago';save();closeModal();view='home';render();say('Nuovo incarico accettato!')}
function cupOpponent(){const opponents=state.table.filter(t=>t.name!==state.clubName).sort((a,b)=>b.level-a.level);return opponents[(state.cupRound+state.season-1)%opponents.length]||state.table[1]}
function openMatchSetup(type='league'){if(type==='league'&&!nextFixture()){say('Stagione completata');return}const match=nextFixture();const isCup=type==='cup';if(isCup&&state.cupRound>=5){say('Coppa nazionale già conclusa');return}const opp=type==='league'?opponentOf(match):cupOpponent().name;const target=opp;document.getElementById('modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="eyebrow">${isCup?'Coppa nazionale':'Giornata '+(state.week+1)}</div><h2>Preparati alla partita</h2><p>${esc(state.clubName)} ${isCup?'· turno '+(state.cupRound+1)+' · sede da sorteggiare':match?.home===state.clubName?'· in casa':'· in trasferta'} · <b>${esc(target||'Avversario')}</b> · ${state.tactic} · ${avgLevel()} OVR</p><div class="section-title" style="margin-top:20px"><h2>Scegli la simulazione</h2></div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><button class="card" style="padding:14px;text-align:left;background:#ffffff06" onclick="startMatch('fast','${isCup?'cup':'league'}')"><b>⚡ Veloce</b><p class="muted" style="font-size:12px">Risultato, marcatori ed eventi.</p></button><button class="card" style="padding:14px;text-align:left;background:#ffffff06" onclick="startMatch('normal','${isCup?'cup':'league'}')"><b>📋 Normale</b><p class="muted" style="font-size:12px">Cronaca divisa in due tempi.</p></button><button class="card" style="padding:14px;text-align:left;background:#ffffff06" onclick="startMatch('detailed','${isCup?'cup':'league'}')"><b>🎮 Dettagliata</b><p class="muted" style="font-size:12px">Fasce da 10', pause e cambi tattici.</p></button></div><div class="actions" style="margin-top:17px"><button class="btn" onclick="go('squad');closeModal()">Gestisci formazione</button><button class="btn" onclick="closeModal()">Annulla</button></div></div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function startMatch(mode,type){const fixture=nextFixture();if(type==='league'&&!fixture){say('Stagione completata');return}if(type==='cup'&&state.cupRound>=5){say('Coppa nazionale già conclusa');return}const opp=type==='league'?opponentOf(fixture):cupOpponent().name;const home=type==='cup'?Math.random()<.5:fixture.home===state.clubName;const team=state.table.find(t=>t.name===opp)||{name:opp,level:state.level-2};const strength=avgLevel()+(home?2:0)+(state.tactic==='Pressing alto'?1:0);const userGoals=poisson(Math.max(.25,1.15+(strength-team.level)*.045));const oppGoals=poisson(Math.max(.2,1.0+(team.level-(avgLevel()+(home?2:0)))*.045));const score=home?[userGoals,oppGoals]:[oppGoals,userGoals];const events=buildEvents(userGoals,oppGoals,opp);state.match={mode,type,opp,home,score,events,minute:0,log:[],substitutions:0};save();closeModal();if(mode==='detailed'){renderMatchLive();return}if(mode==='normal'){renderMatchNormal();return}finishMatch()}
function poisson(lambda){let L=Math.exp(-Math.min(lambda,3)),k=0,p=1;do{k++;p*=Math.random()}while(p>L&&k<8);return k-1}
function buildEvents(userGoals,oppGoals,opp){const out=[];for(let i=0;i<userGoals;i++){const p=pickScorer(true);out.push({min:2+Math.floor(Math.random()*88),text:`GOAL! ${p?.name||'Il centravanti'} insacca per ${state.clubName}.`,goal:true,side:'user',player:p?.id})}for(let i=0;i<oppGoals;i++)out.push({min:2+Math.floor(Math.random()*88),text:`Rete di ${pickOpponentScorer(opp)}: ${opp} trova il gol.`,goal:true,side:'opp'});for(let i=0;i<2+Math.floor(Math.random()*3);i++){const min=8+Math.floor(Math.random()*79);out.push({min,text:[`Grande parata del portiere, che salva il risultato.`,`Occasione! Il tiro sfiora il palo.`,`Ammonizione per un intervento in ritardo.`,`La partita si accende: ritmo alto e duelli a centrocampo.`][Math.floor(Math.random()*4)],goal:false})}return out.sort((a,b)=>a.min-b.min)}
function pickScorer(){const candidates=state.squad.filter(p=>p.starter&&p.pos!=='POR');return candidates[Math.floor(Math.random()*candidates.length)]}function pickOpponentScorer(name){return ['il centravanti','il numero 10','un colpo di testa','una conclusione dal limite'][Math.floor(Math.random()*4)]}
function renderMatchNormal(){const m=state.match;const halftime=m.events.filter(e=>e.min<=45),second=m.events.filter(e=>e.min>45);let c=`<div class="modal-back"><div class="modal" style="width:min(720px,100%)"><div class="eyebrow">CRONACA · ${m.type==='cup'?'Coppa nazionale':'Campionato'}</div><h2>${esc(m.home?state.clubName:m.opp)} vs ${esc(m.home?m.opp:state.clubName)}</h2><div class="section-title"><h2>Primo tempo</h2></div>${halftime.map(eventHtml).join('')||'<p class="muted">Partita bloccata, squadre attente.</p>'}<div class="section-title" style="margin-top:18px"><h2>Secondo tempo</h2></div>${second.map(eventHtml).join('')||'<p class="muted">Poche occasioni nella ripresa.</p>'}<div class="actions" style="justify-content:flex-end;margin-top:15px"><button class="btn primary" onclick="finishMatch()">Mostra risultato finale</button></div></div></div>`;document.getElementById('modal-root').innerHTML=c}
function eventHtml(e){return `<div class="match-event ${e.goal?'goal':''}"><b>${e.min}'</b> &nbsp;${esc(e.text)}</div>`}
function renderMatchLive(){const m=state.match;const events=m.events.filter(e=>e.min<=m.minute);document.getElementById('modal-root').innerHTML=`<div class="modal-back"><div class="modal" style="width:min(760px,100%)"><div class="eyebrow">DIRETTA · ${m.minute>=90?'TEMPO SCADUTO':`MINUTO ${m.minute}`}</div><div class="scoreboard"><div class="team">${esc(m.home?state.clubName:m.opp)}</div><strong>${scoreLive(0)} – ${scoreLive(1)}</strong><div class="team">${esc(m.home?m.opp:state.clubName)}</div></div><div class="section-title"><h2>La partita</h2><span class="status">${state.formation} · ${state.tactic}</span></div><div style="max-height:210px;overflow:auto">${events.slice(-7).map(eventHtml).join('')||'<p class="muted">Fischio d’inizio. Le squadre prendono le misure…</p>'}</div><div class="actions" style="margin-top:17px"><button class="btn" onclick="matchTactic()">Cambia atteggiamento</button><button class="btn" onclick="substitute()">Sostituzione (${m.substitutions}/5)</button><button class="btn primary" onclick="${m.minute>=90?'finishMatch()':'advanceMatchMinute()'}">${m.minute>=90?'Termina partita':'Avanza 10\''}</button></div><p class="muted" style="font-size:11px;margin:12px 0 0">Puoi fare modifiche in ogni pausa. Nessun tempo avanza senza un tuo comando.</p></div></div>`}
function scoreLive(side){const m=state.match;const user= m.events.filter(e=>e.goal&&e.side==='user'&&e.min<=m.minute).length;const opp=m.events.filter(e=>e.goal&&e.side==='opp'&&e.min<=m.minute).length;return side===0?(m.home?user:opp):(m.home?opp:user)}
function finishMatch(){
  const m=state.match;
  if(!m)return;
  if(m.mode==='detailed'&&m.minute<90){m.minute=90;renderMatchLive();return}
  const userGoals=m.events.filter(e=>e.goal&&e.side==='user').length;
  const oppGoals=m.events.filter(e=>e.goal&&e.side==='opp').length;
  const homeGoals=m.home?userGoals:oppGoals;
  const awayGoals=m.home?oppGoals:userGoals;
  m.score=[homeGoals,awayGoals];
  let penalties='',cupWinner=null;
  if(m.type==='cup'&&userGoals===oppGoals){
    let userPens=3+Math.floor(Math.random()*4),oppPens=3+Math.floor(Math.random()*4);
    while(userPens===oppPens){if(Math.random()<.5)userPens++;else oppPens++}
    m.penalties=[userPens,oppPens];cupWinner=userPens>oppPens;
    penalties=` (rigori ${userPens}-${oppPens})`;
  }
  const won=m.type==='cup'&&cupWinner!==null?cupWinner:userGoals>oppGoals;
  const draw=m.type!=='cup'&&userGoals===oppGoals;
  const summary=`${m.home?state.clubName:m.opp} ${m.score[0]}–${m.score[1]} ${m.home?m.opp:state.clubName}`;
  const user=state.table.find(t=>t.name===state.clubName),opp=state.table.find(t=>t.name===m.opp);
  if(m.type==='league'){
    if(m.home)recordResult(user,opp,homeGoals,awayGoals);else recordResult(opp,user,homeGoals,awayGoals);
    const fixture=state.fixtures[state.week]?.find(g=>g.home===state.clubName||g.away===state.clubName);
    if(fixture){fixture.played=true;fixture.score=[homeGoals,awayGoals]}
    simulateOtherGames();state.week++;advanceDate();state.rep+=won?2:draw?1:-1;
    if(user)user.matchForm=won?'V':draw?'N':'P';
  }else if(won){
    state.cupRound++;
    if(state.cupRound>=5){state.trophies++;state.rep+=10;addNews(`${state.clubName} alza la Coppa nazionale! Trionfo storico per il club.`,'🏆')}
  }else state.cupRound=5;
  const scorers=m.events.filter(e=>e.goal&&e.side==='user').map(e=>state.squad.find(p=>p.id===e.player)).filter(Boolean);
  scorers.forEach(p=>p.goals++);
  handleMatchEvents();
  addNews(`${summary}${penalties}${won?' · Vittoria':draw?' · Pareggio':' · Sconfitta'}.`,won?'🎉':'⚽');
  save();
  const message=m.mode==='fast'?`<div class="section-title"><h2>Eventi principali</h2></div>${m.events.filter(e=>e.goal).map(eventHtml).join('')||'<p class="muted">Reti inviolate. Difese protagoniste.</p>'}`:'';
  document.getElementById('modal-root').innerHTML=`<div class="modal-back"><div class="modal"><div class="eyebrow">FISCHIO FINALE · ${m.type==='cup'?'COPPA NAZIONALE':'CAMPIONATO'}</div><div class="scoreboard"><div class="team">${esc(m.home?state.clubName:m.opp)}</div><strong>${m.score[0]} – ${m.score[1]}</strong><div class="team">${esc(m.home?m.opp:state.clubName)}</div></div>${message}${penalties?`<div class="notice">Decisione ai rigori: ${m.penalties[0]}–${m.penalties[1]}.</div>`:''}<div class="notice" style="margin-top:14px">${won?'Ottimo lavoro, Mister.':draw?'Un punto importante per la classifica.':'La squadra dovrà reagire alla prossima.'} ${state.week%19===0&&m.type==='league'?' Finestra di mercato: +500 crediti assegnati.':''}</div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn primary" onclick="closeModal();view='home';render()">Continua →</button></div></div></div>`;
  state.match=null;save()
}
function recordResult(a,b,homeGoals,awayGoals){if(!a||!b)return;a.gf+=homeGoals;a.ga+=awayGoals;b.gf+=awayGoals;b.ga+=homeGoals;if(homeGoals>awayGoals){a.w++;a.pts+=3;b.l++}else if(homeGoals<awayGoals){b.w++;b.pts+=3;a.l++}else{a.d++;b.d++;a.pts++;b.pts++}}
function simulateOtherGames(){const games=state.fixtures[state.week]||[];games.forEach(g=>{if(g.home===state.clubName||g.away===state.clubName){g.played=true;g.score=[0,0];return}let a=state.table.find(t=>t.name===g.home),b=state.table.find(t=>t.name===g.away);let x=poisson(1.1+((a?.level||state.level)-(b?.level||state.level))*.04),y=poisson(1.1+((b?.level||state.level)-(a?.level||state.level))*.04);if(a&&b)recordResult(a,b,x,y);g.played=true;g.score=[x,y]})}
function handleMatchEvents(){
  state.squad.forEach(p=>{
    const wasUnavailable=p.injury>0||p.bans>0;
    if(p.starter){
      p.stamina=Math.max(15,p.stamina-15-Math.floor(Math.random()*9));
      if(Math.random()<.018){p.injury=1+Math.floor(Math.random()*4);addNews(`${p.name} si ferma per un infortunio: stop previsto ${p.injury} giornate.`,'🚑')}
      if(Math.random()<.065){p.yellow++;if(p.yellow>=5){p.bans=1;p.yellow=0;addNews(`${p.name} squalificato per somma di ammonizioni.`,'🟨')}}
      if(Math.random()<.012){p.bans=2;addNews(`${p.name} espulso: due giornate di squalifica.`,'🟥')}
    }else{
      p.stamina=Math.min(100,p.stamina+6);
      if(wasUnavailable){if(p.injury>0)p.injury--;else if(p.bans>0)p.bans--;}
    }
  });
  setLineup()
}
function advanceDate(){state.day=`Dom ${String(10+(state.week*7)%27).padStart(2,'0')} ${['Ago','Ago','Set','Set','Ott','Ott','Nov','Nov','Dic','Dic','Gen','Gen','Feb','Feb','Mar','Mar','Apr','Apr','Mag'][Math.min(18,Math.floor(state.week/2))]||'Mag'}`;if(state.week===19||state.week===0){state.budget+=500;addNews('Aperta la finestra di mercato: la dirigenza stanzia 500 crediti per rinforzare la rosa.','💰','market')}if(state.week%5===0)worldTransfer()}
function showCareerDecision(){
  const decision=state.pendingCareer;
  if(!decision)return;
  const offers=decision.offers||[];
  document.getElementById('modal-root').innerHTML=`<div class="modal-back"><div class="modal"><div class="eyebrow">STAGIONE CONCLUSA · ${decision.club}</div><h2>${decision.goalMet?'Obiettivo centrato!':'La dirigenza è delusa.'}</h2><p>${esc(decision.club)} ha terminato al <b>${decision.rank}° posto</b>. ${decision.champion?'Campioni!':decision.goalMet?'La società è soddisfatta del lavoro.':'La tua posizione è a rischio.'}</p><div class="section-title"><h2>Il futuro</h2></div>${!decision.goalMet?'<button class="btn danger wide" onclick="resolveCareerDecision(&quot;dismiss&quot;)">La dirigenza ti esonera · Cerca un nuovo incarico</button>':'<button class="btn primary wide" onclick="resolveCareerDecision(&quot;renew&quot;)">Rinnova · resta al club</button>'}${offers.map((o,i)=>`<button class="btn wide" style="margin-top:8px" onclick="acceptOffer(${i})">Accetta: ${esc(o.name)} · ${esc(o.league)}</button>`).join('')}<button class="btn wide" style="margin-top:8px" onclick="closeModal();save()">Deciderò più tardi</button></div></div>`
}
function resolveCareerDecision(choice){
  const decision=state.pendingCareer;
  if(!decision)return;
  state.pendingCareer=null;
  if(choice==='renew'){state.contract++;closeModal();save();render();say('Contratto rinnovato!')}
  else if(choice==='dismiss')dismissManager();
}
function endSeason(){
  if(state.pendingCareer){showCareerDecision();return}
  if(state.week<state.fixtures.length){say('Completa prima tutte le giornate');return}
  const rank=myTable(),goalMet=state.goal==='safe'?rank<=16:state.goal==='mid'?rank<=12:rank<=8;
  const champion=rank===1;
  if(champion){state.trophies++;state.rep+=15;addNews(`${state.clubName} è campione! Un trionfo che entra nella storia.`,'🏆')}
  if(goalMet&&!champion)state.rep+=5;else if(!goalMet)state.rep=Math.max(0,state.rep-8);
  state.history.push({season:state.season,club:state.clubName,rank,result:goalMet?'success':'fail',trophy:champion});
  const young=state.squad.filter(p=>p.age<=21).sort((a,b)=>b.overall-a.overall)[0];
  if(young){young.overall++;young.value+=8;addNews(`Premio miglior giovane: ${young.name} (${state.clubName}) chiude l’anno da protagonista.`,'🌟')}
  state.squad.forEach(p=>{p.age++;p.stamina=100;p.injury=0;p.bans=0;if(p.age>=34&&Math.random()<.18){state.squad=state.squad.filter(x=>x.id!==p.id);addNews(`${p.name} annuncia il ritiro dal calcio giocato.`,'👋')}});
  for(let i=0;i<3;i++){let p=makePlayer(i,45+Math.floor(Math.random()*18),16+Math.floor(Math.random()*3));p.value+=10;state.squad.push(p)}
  setLineup();state.table.forEach(t=>{t.pts=0;t.w=0;t.d=0;t.l=0;t.gf=0;t.ga=0});
  state.season++;state.week=0;state.budget+=500;state.cupRound=0;makeFixtures();state.contract=Math.max(0,state.contract-1);state.day='Lun 04 Ago';
  addNews(`Nuova stagione: ${state.clubName} riparte con ${state.squad.length} giocatori e tre giovani talenti promossi in prima squadra.`,'🌱');
  state.pendingCareer={club:state.clubName,rank,goalMet,champion,offers:careerOffers()};
  save();showCareerDecision()
}
function dismissManager(){let low=clubs.filter(c=>c.name!==state.clubName&&c.prestige<state.prestige).sort((a,b)=>a.prestige-b.prestige)[0]||clubs.find(c=>c.name!==state.clubName)||clubs[0];state.pendingCareer=null;state.club=clubs.indexOf(low);state.clubName=low.name;state.league=low.league;state.level=low.level;state.goal=low.goal;state.target=low.target;state.prestige=low.prestige;state.budget=500;state.squad=Array.from({length:22},(_,i)=>makePlayer(i,low.level));setLineup();state.table=newLeagueTable(low.name,low.level);state.cupRound=0;state.rep=Math.max(0,state.rep-10);state.contract=1;state.week=0;state.day='Lun 04 Ago';makeFixtures();closeModal();addNews(`Esonerato dal precedente incarico, ${state.clubName} offre una nuova occasione di riscatto.`,'📣');save();render()}
function resetGame(){if(confirm('Vuoi davvero iniziare una nuova carriera? Il salvataggio attuale sarà sostituito.')){localStorage.removeItem(SAVE_KEY);state=null;view='home';render()}}

function advanceMatchMinute(){state.match.minute=Math.min(90,state.match.minute+10);save();renderMatchLive()}
function matchTactic(){const opts=['Equilibrato','Pressing alto','Contropiede','Possesso palla','Difesa bassa','Tutto per tutto'];state.tactic=opts[(opts.indexOf(state.tactic)+1)%opts.length];save();say('Assetto: '+state.tactic);renderMatchLive()}
function substitute(){const m=state.match;if(m.substitutions>=5){say('Hai esaurito le sostituzioni');return}const out=state.squad.find(p=>p.starter&&p.pos!=='POR'),inn=state.squad.find(p=>!p.starter&&!p.injury&&!p.bans);if(!out||!inn){say('Nessuna sostituzione disponibile');return}out.starter=false;inn.starter=true;m.substitutions++;save();renderMatchLive();say(`${inn.name} per ${out.name}`)}
render();
</script>
